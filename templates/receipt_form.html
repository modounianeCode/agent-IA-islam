{% extends "base.html" %}
{% block title %}Nouveau Recu{% endblock %}

{% block content %}
<h2>Nouveau Recu / Quittance</h2>

<div class="card">
    <form method="POST">
        <h3>Informations client</h3>
        <div class="form-row">
            <div class="form-group">
                <label>Nom du client *</label>
                <input type="text" name="client_name" required>
            </div>
            <div class="form-group">
                <label>Telephone</label>
                <input type="text" name="client_phone">
            </div>
        </div>
        <div class="form-group">
            <label>Adresse</label>
            <input type="text" name="client_address">
        </div>
        <div class="form-group">
            <label>Motif du paiement</label>
            <input type="text" name="motif" placeholder="Ex: Achat de marchandises, Paiement facture...">
        </div>

        <h3>Articles / Services</h3>
        <div class="items-container" id="items-container">
            <div class="item-row">
                <input type="text" name="item_description[]" placeholder="Description" required>
                <input type="number" name="item_quantity[]" placeholder="Qte" value="1" min="1">
                <input type="number" name="item_price[]" placeholder="Prix unitaire" step="0.01" min="0">
                <input type="text" disabled placeholder="Total">
                <button type="button" class="btn btn-danger" onclick="removeItem(this)" style="padding: 0.3rem 0.6rem;">X</button>
            </div>
        </div>
        <button type="button" class="btn btn-secondary" onclick="addItem()" style="margin-top: 0.5rem;">+ Ajouter un article</button>

        <div style="margin-top: 1.5rem;">
            <button type="submit" class="btn btn-success">Creer le recu</button>
            <a href="{{ url_for('list_receipts') }}" class="btn btn-secondary">Annuler</a>
        </div>
    </form>
</div>

<script>
function addItem() {
    const container = document.getElementById('items-container');
    const row = document.createElement('div');
    row.className = 'item-row';
    row.innerHTML = `
        <input type="text" name="item_description[]" placeholder="Description" required>
        <input type="number" name="item_quantity[]" placeholder="Qte" value="1" min="1">
        <input type="number" name="item_price[]" placeholder="Prix unitaire" step="0.01" min="0">
        <input type="text" disabled placeholder="Total">
        <button type="button" class="btn btn-danger" onclick="removeItem(this)" style="padding: 0.3rem 0.6rem;">X</button>
    `;
    container.appendChild(row);
}

function removeItem(btn) {
    const container = document.getElementById('items-container');
    if (container.children.length > 1) {
        btn.parentElement.remove();
    }
}
</script>
{% endblock %}
