name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Configuration de Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Installation des dépendances
        run: pip install -r requirements.txt

      - name: Téléchargement du corpus (Coran + 17 recueils de hadiths)
        run: python -m agent.ingest --download

      - name: Construction de la base locale (data/agent.db)
        run: python -m agent.ingest --build

      - name: Exécution des tests unitaires
        run: python -m unittest discover -s tests -v